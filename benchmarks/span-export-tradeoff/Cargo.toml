[package]
autobins = false
name = "span-export-tradeoff-probe"
version = "0.9.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
fast-telemetry = { path = "../../crates/fast-telemetry", default-features = false, features = ["otlp"] }
libc = "0.2"
prost = "0.13"

flate2 = "1"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["net", "rt", "time"] }

[[bin]]
test = false
bench = false

name = "span-export-http-probe"
path = "src/http.rs"

[profile.release]
debug = 1


[[bin]]
name = "span-export-tradeoff-probe"
path = "src/main.rs"
test = false
bench = false
