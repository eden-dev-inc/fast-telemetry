name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo clippy -p fast-telemetry-export --no-default-features -- -D warnings
      - run: cargo clippy -p fast-telemetry-export --no-default-features --features otlp-logs -- -D warnings
      - run: cargo clippy -p fast-telemetry-export --no-default-features --features monoio -- -D warnings
      - run: cargo clippy -p fast-telemetry-export --no-default-features --features compio -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo test -p fast-telemetry-export --no-default-features --features otlp-logs

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  package:
    name: Published crate verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package and build all four release crates
        run: cargo package --workspace --exclude fast-telemetry-demo --all-features
      - name: Check packaged licenses
        shell: python
        run: |
          import pathlib
          import tarfile
          import tomllib
          license_text = pathlib.Path("LICENSE").read_bytes()
          for name in ("fast-telemetry-macros", "fast-telemetry", "fast-telemetry-export", "fast-telemetry-tracing"):
              manifest = tomllib.loads(pathlib.Path(f"crates/{name}/Cargo.toml").read_text())
              package = f"{name}-{manifest['package']['version']}"
              with tarfile.open(f"target/package/{package}.crate") as archive:
                  assert archive.extractfile(f"{package}/LICENSE").read() == license_text, name

  tracing-pipeline:
    name: Tracing pipeline verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/tracing-end-to-end
      - run: cargo test --release --locked --manifest-path benchmarks/tracing-end-to-end/Cargo.toml
      - run: cargo clippy --release --locked --all-targets --manifest-path benchmarks/tracing-end-to-end/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path benchmarks/tracing-end-to-end/Cargo.toml -- --check
      - name: Verify retained sender payloads
        shell: bash
        run: |
          cargo build --release --locked --manifest-path benchmarks/tracing-end-to-end/Cargo.toml
          for mode in native drop-in otel; do
            for workload in root children attributes; do
              for threads in 1 8 16; do
                benchmarks/tracing-end-to-end/target/release/tracing-end-to-end \
                  "$mode" "$workload" "$threads" "$((512 / threads))" 2 1 capture
              done
            done
          done
      - name: Verify configured native producer batches
        shell: bash
        run: |
          for target in 1 17 256 384 512 1024; do
            for workload in root children attributes; do
              for threads in 1 8 16; do
                benchmarks/tracing-end-to-end/target/release/tracing-end-to-end \
                  native "$workload" "$threads" "$((512 / threads))" 2 1 capture "$target"
              done
            done
          done
